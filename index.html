<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 法規領航員 - 搜尋模式演進示範</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 15px 25px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .mode-btn.active {
            background: white;
            color: #667eea;
        }

        .search-interface {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            min-height: 600px;
        }

        .interface-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .interface-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .interface-subtitle {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .search-content {
            padding: 40px;
        }

        .search-box {
            position: relative;
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 20px 60px 20px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-input:focus {
            border-color: #667eea;
        }

        .search-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .search-btn:hover {
            background: #5a67d8;
        }

        .results-container {
            margin-top: 30px;
        }

        .result-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s ease;
        }

        .result-item:hover {
            transform: translateX(5px);
        }

        .result-title {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .result-description {
            color: #4a5568;
            line-height: 1.6;
        }

        .result-meta {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #718096;
        }

        .ai-response {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            color: #2d3748;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .ai-response h3 {
            color: #667eea;
            font-weight: 600;
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            margin: -5px -5px 15px -5px;
            border-left: 3px solid #667eea;
        }

        .ai-response h3 {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #667eea;
            font-weight: 600;
        }

        .ai-response p, .ai-response strong {
            color: #2d3748;
        }

        .ai-response ul, .ai-response ol {
            color: #4a5568;
        }

        .conversation-flow {
            display: none;
        }

        .conversation-flow.active {
            display: block;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: #e3f2fd;
            padding: 15px 20px;
            border-radius: 15px 15px 5px 15px;
            margin-left: 60px;
        }

        .ai-message {
            background: #f3e5f5;
            padding: 15px 20px;
            border-radius: 15px 15px 15px 5px;
            margin-right: 60px;
        }

        .follow-up-questions {
            margin-top: 15px;
        }

        .question-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .question-btn:hover {
            background: white;
            transform: translateX(5px);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .category-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .category-item:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .category-icon {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 10px;
        }

        .expandable-section {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            margin-top: 20px;
            overflow: hidden;
        }

        .expandable-header {
            background: #f8f9fa;
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .expandable-content {
            padding: 20px;
            display: none;
        }

        .expandable-content.expanded {
            display: block;
        }

        .hidden {
            display: none;
        }

        /* Multimodal Content Styles */
        .multimodal-content {
            margin: 20px 0;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
        }

        .content-tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }

        .content-tab {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            transition: all 0.3s ease;
        }

        .content-tab:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .content-tab.active {
            background: white;
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }

        .content-panel {
            padding: 20px;
            display: none;
        }

        .content-panel.active {
            display: block;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .info-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .info-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .info-card h4 {
            margin: 10px 0 5px 0;
            color: #2d3748;
        }

        .info-card p {
            color: #666;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .info-card small {
            color: #667eea;
            font-weight: 600;
        }

        /* Flowchart Styles */
        .flowchart-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px 0;
        }

        .flow-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-width: 150px;
        }

        .step-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .step-content h4 {
            margin: 0 0 5px 0;
            color: #2d3748;
        }

        .step-content p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }

        .flow-arrow {
            font-size: 1.5rem;
            color: #667eea;
            font-weight: bold;
        }

        /* Example Cases Styles */
        .example-cases {
            display: grid;
            gap: 15px;
        }

        .case-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            background: white;
        }

        .case-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .case-tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .case-tag.success {
            background: #d4edda;
            color: #155724;
        }

        .case-tag.warning {
            background: #fff3cd;
            color: #856404;
        }

        .case-header h4 {
            margin: 0;
            color: #2d3748;
        }

        .case-metrics {
            margin-top: 10px;
            display: flex;
            gap: 15px;
        }

        .case-metrics span {
            font-size: 0.9rem;
            color: #667eea;
            font-weight: 500;
        }

        /* Requirement Checklist Styles */
        .requirement-checklist {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .checklist-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }

        .check-icon {
            font-size: 1.5rem;
            color: #28a745;
        }

        .check-content h4 {
            margin: 0 0 8px 0;
            color: #2d3748;
        }

        .check-content p {
            margin: 0 0 10px 0;
            color: #666;
        }

        .requirement-media {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .media-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 10px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #667eea;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .media-item:hover {
            background: #e9ecef;
        }

        .media-icon {
            font-size: 1rem;
        }

        /* Timeline Styles */
        .timeline-visual {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .timeline-item {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .timeline-marker {
            width: 80px;
            height: 30px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: white;
            flex-shrink: 0;
        }

        .timeline-marker.start {
            background: #28a745;
        }

        .timeline-marker.process {
            background: #ffc107;
            color: #000;
        }

        .timeline-marker.end {
            background: #dc3545;
        }

        .timeline-content {
            flex: 1;
        }

        .timeline-content h4 {
            margin: 0 0 10px 0;
            color: #2d3748;
        }

        .timeline-content ul {
            margin: 0;
            padding-left: 20px;
            color: #666;
        }

        /* Resource Grid Styles */
        .resource-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .resource-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background: white;
            transition: transform 0.2s ease;
        }

        .resource-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .resource-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .resource-card h4 {
            margin: 0 0 10px 0;
            color: #2d3748;
        }

        .resource-card p {
            color: #666;
            margin-bottom: 15px;
        }

        .resource-links {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .resource-link {
            display: inline-block;
            padding: 6px 12px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }

        .resource-link:hover {
            background: #5a67d8;
        }

        /* Risk Assessment Styles */
        .risk-assessment .info-card {
            transition: all 0.3s ease;
        }

        .risk-assessment .info-card.high-risk {
            border-left: 4px solid #dc3545;
        }

        .risk-assessment .info-card.medium-risk {
            border-left: 4px solid #ffc107;
        }

        .risk-assessment .info-card.low-risk {
            border-left: 4px solid #28a745;
        }

        .risk-examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .risk-examples span {
            padding: 4px 8px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 6px;
            font-size: 0.8rem;
            color: #667eea;
        }

        /* Evaluation Steps Styles */
        .evaluation-steps {
            max-width: 100%;
        }

        .step-by-step {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .eval-step {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        .step-header {
            background: #f8f9fa;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .step-num {
            width: 30px;
            height: 30px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .step-header h4 {
            margin: 0;
            color: #2d3748;
        }

        .step-content {
            padding: 15px;
        }

        .interactive-checklist {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .interactive-checklist label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 5px;
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        .interactive-checklist label:hover {
            background: #f8f9fa;
        }

        .impact-scale {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .scale-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .scale-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .scale-dot.high {
            background: #dc3545;
        }

        .scale-dot.medium {
            background: #ffc107;
        }

        .scale-dot.low {
            background: #28a745;
        }

        .tech-features {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        .feature-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .feature-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .feature-item h5 {
            margin: 0 0 4px 0;
            color: #2d3748;
        }

        .feature-item p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }

        .assessment-result {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
            color: white;
        }

        .result-box h4 {
            margin: 0 0 15px 0;
        }

        .tool-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tool-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .tool-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .link-icon {
            font-size: 1.5rem;
        }

        .tool-link h5 {
            margin: 0 0 2px 0;
        }

        .tool-link p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* Example Gallery Styles */
        .example-gallery {
            padding: 0;
        }

        .example-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .example-card {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            background: white;
            transition: transform 0.2s ease;
        }

        .example-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .example-media {
            position: relative;
            height: 120px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-placeholder {
            position: relative;
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .play-button, .view-button, .demo-button {
            position: absolute;
            bottom: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .media-label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .example-content {
            padding: 15px;
        }

        .example-content h4 {
            margin: 0 0 10px 0;
            color: #2d3748;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .risk-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .risk-badge.high {
            background: #f8d7da;
            color: #721c24;
        }

        .risk-badge.medium {
            background: #fff3cd;
            color: #856404;
        }

        .risk-badge.low {
            background: #d4edda;
            color: #155724;
        }

        .example-details {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .example-details span {
            font-size: 0.85rem;
            color: #666;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Floating Design Insights Styles */
        .design-insights-trigger {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
            display: none;
        }

        .design-insights-trigger:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.4);
        }

        .design-insights-trigger.visible {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .design-insights-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.15);
            z-index: 1001;
            transition: right 0.4s ease;
            overflow-y: auto;
        }

        .design-insights-panel.open {
            right: 0;
        }

        .insights-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .insights-header h3 {
            margin: 0 0 5px 0;
            font-size: 1.3rem;
        }

        .insights-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .close-insights {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .close-insights:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .insights-content {
            padding: 20px;
        }

        .insight-section {
            margin-bottom: 25px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }

        .insight-header {
            background: #f8f9fa;
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .insight-icon {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            font-weight: bold;
        }

        .insight-icon.conversation {
            background: #667eea;
        }

        .insight-icon.personalization {
            background: #28a745;
        }

        .insight-icon.integration {
            background: #ffc107;
            color: #000;
        }

        .insight-icon.cost-reduction {
            background: #dc3545;
        }

        .insight-body {
            padding: 15px;
        }

        .insight-title {
            font-weight: 600;
            color: #2d3748;
            margin: 0 0 8px 0;
        }

        .insight-description {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .insight-benefit {
            background: #e8f4f8;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #0c5460;
            border-left: 3px solid #17a2b8;
        }

        .cost-breakdown {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cost-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid #dc3545;
        }

        .cost-arrow {
            color: #dc3545;
            font-weight: bold;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .cost-content h5 {
            margin: 0 0 4px 0;
            color: #2d3748;
            font-size: 0.9rem;
        }

        .cost-problem {
            color: #666;
            font-size: 0.8rem;
            font-style: italic;
        }

        .design-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .design-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        @media (max-width: 768px) {
            .flowchart-container {
                flex-direction: column;
            }
            
            .flow-arrow {
                transform: rotate(90deg);
            }
            
            .timeline-item {
                flex-direction: column;
                gap: 10px;
            }
            
            .resource-grid {
                grid-template-columns: 1fr;
            }
            
            .example-grid {
                grid-template-columns: 1fr;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
            
            .tool-links {
                grid-template-columns: 1fr;
            }

            .design-insights-panel {
                width: 100%;
                right: -100%;
            }

            .design-insights-trigger {
                bottom: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
        }

</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-gavel"></i> AI 法規領航員</h1>
            <p>體驗從關鍵詞搜尋到智慧對話的演進過程</p>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="traditional">
                <i class="fas fa-search"></i> 傳統關鍵詞搜尋
            </button>
            <button class="mode-btn" data-mode="hybrid">
                <i class="fas fa-robot"></i> 混合式智慧搜尋
            </button>
            <button class="mode-btn" data-mode="conversational">
                <i class="fas fa-comments"></i> 對話式法規諮詢
            </button>
        </div>

        <div class="search-interface">
            <!-- Traditional Mode -->
            <div id="traditional-mode" class="search-mode">
                <div class="interface-header">
                    <div class="interface-title">傳統關鍵詞搜尋模式</div>
                    <div class="interface-subtitle">基於關鍵詞匹配的靜態搜尋結果</div>
                </div>
                <div class="search-content">
                    <div class="search-box">
                        <input type="text" class="search-input" placeholder="輸入關鍵詞搜尋法規..." value="AI 法規">
                        <button class="search-btn"><i class="fas fa-search"></i></button>
                    </div>
                    
                    <div class="results-container" id="traditional-results">
                        <!-- Results will be populated by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Hybrid Mode -->
            <div id="hybrid-mode" class="search-mode hidden">
                <div class="interface-header">
                    <div class="interface-title">混合式智慧搜尋</div>
                    <div class="interface-subtitle">AI 理解 + 傳統搜尋的完美結合</div>
                </div>
                <div class="search-content">
                    <div class="search-box">
                        <input type="text" class="search-input" placeholder="描述您的情境，例如：我是智慧醫療新創..." value="我是一家做智慧醫療影像辨識的新創，這法案對我有什麼衝擊？">
                        <button class="search-btn"><i class="fas fa-search"></i></button>
                    </div>
                    
                    <div class="results-container" id="hybrid-results">
                        <!-- Results will be populated by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Conversational Mode -->
            <div id="conversational-mode" class="search-mode hidden">
                <div class="interface-header">
                    <div class="interface-title">對話式法規諮詢</div>
                    <div class="interface-subtitle">智慧問答，深度探索法規影響</div>
                </div>
                <div class="search-content">
                    <div class="search-box">
                        <input type="text" class="search-input" placeholder="告訴我您的情況..." value="">
                        <button class="search-btn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                    
                    <div class="conversation-flow" id="conversation-container">
                        <!-- Conversation will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Design Insights Floating Components -->
    <button class="design-insights-trigger" id="insights-trigger">
        <i class="fas fa-lightbulb"></i>
    </button>

    <div class="design-overlay" id="design-overlay"></div>
    
    <div class="design-insights-panel" id="insights-panel">
        <div class="insights-header">
            <h3 id="insights-title">設計理念</h3>
            <p id="insights-subtitle">了解這個模式的核心價值</p>
            <button class="close-insights" id="close-insights">×</button>
        </div>
        
        <div class="insights-content" id="insights-content">
            <!-- Content will be populated by JavaScript -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
