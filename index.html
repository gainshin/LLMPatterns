<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 法規領航員 - 搜尋模式演進示範</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 15px 25px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .mode-btn.active {
            background: white;
            color: #667eea;
        }

        .search-interface {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            min-height: 600px;
        }

        .interface-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .interface-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .interface-subtitle {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .search-content {
            padding: 40px;
        }

        .search-box {
            position: relative;
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 20px 60px 20px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-input:focus {
            border-color: #667eea;
        }

        .search-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .search-btn:hover {
            background: #5a67d8;
        }

        .results-container {
            margin-top: 30px;
        }

        .result-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s ease;
        }

        .result-item:hover {
            transform: translateX(5px);
        }

        .result-title {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .result-description {
            color: #4a5568;
            line-height: 1.6;
        }

        .result-meta {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #718096;
        }

        .ai-response {
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            color: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .ai-response h3 {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .conversation-flow {
            display: none;
        }

        .conversation-flow.active {
            display: block;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: #e3f2fd;
            padding: 15px 20px;
            border-radius: 15px 15px 5px 15px;
            margin-left: 60px;
        }

        .ai-message {
            background: #f3e5f5;
            padding: 15px 20px;
            border-radius: 15px 15px 15px 5px;
            margin-right: 60px;
        }

        .follow-up-questions {
            margin-top: 15px;
        }

        .question-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .question-btn:hover {
            background: white;
            transform: translateX(5px);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .category-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .category-item:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .category-icon {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 10px;
        }

        .expandable-section {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            margin-top: 20px;
            overflow: hidden;
        }

        .expandable-header {
            background: #f8f9fa;
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .expandable-content {
            padding: 20px;
            display: none;
        }

        .expandable-content.expanded {
            display: block;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-gavel"></i> AI 法規領航員</h1>
            <p>體驗從關鍵詞搜尋到智慧對話的演進過程</p>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="traditional">
                <i class="fas fa-search"></i> 傳統關鍵詞搜尋
            </button>
            <button class="mode-btn" data-mode="hybrid">
                <i class="fas fa-robot"></i> 混合式智慧搜尋
            </button>
            <button class="mode-btn" data-mode="conversational">
                <i class="fas fa-comments"></i> 對話式法規諮詢
            </button>
        </div>

        <div class="search-interface">
            <!-- Traditional Mode -->
            <div id="traditional-mode" class="search-mode">
                <div class="interface-header">
                    <div class="interface-title">傳統關鍵詞搜尋模式</div>
                    <div class="interface-subtitle">基於關鍵詞匹配的靜態搜尋結果</div>
                </div>
                <div class="search-content">
                    <div class="search-box">
                        <input type="text" class="search-input" placeholder="輸入關鍵詞搜尋法規..." value="AI 法規">
                        <button class="search-btn"><i class="fas fa-search"></i></button>
                    </div>
                    
                    <div class="results-container" id="traditional-results">
                        <!-- Results will be populated by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Hybrid Mode -->
            <div id="hybrid-mode" class="search-mode hidden">
                <div class="interface-header">
                    <div class="interface-title">混合式智慧搜尋</div>
                    <div class="interface-subtitle">AI 理解 + 傳統搜尋的完美結合</div>
                </div>
                <div class="search-content">
                    <div class="search-box">
                        <input type="text" class="search-input" placeholder="描述您的情境，例如：我是智慧醫療新創..." value="我是一家做智慧醫療影像辨識的新創，這法案對我有什麼衝擊？">
                        <button class="search-btn"><i class="fas fa-search"></i></button>
                    </div>
                    
                    <div class="results-container" id="hybrid-results">
                        <!-- Results will be populated by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Conversational Mode -->
            <div id="conversational-mode" class="search-mode hidden">
                <div class="interface-header">
                    <div class="interface-title">對話式法規諮詢</div>
                    <div class="interface-subtitle">智慧問答，深度探索法規影響</div>
                </div>
                <div class="search-content">
                    <div class="search-box">
                        <input type="text" class="search-input" placeholder="告訴我您的情況..." value="">
                        <button class="search-btn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                    
                    <div class="conversation-flow" id="conversation-container">
                        <!-- Conversation will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
